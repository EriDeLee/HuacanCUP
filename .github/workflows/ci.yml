name: ci

# Linux 上的完整验证（ADR-0012）：检查、单元测试、需要 KiCad 的工具测试、冒烟。
# 本机 Windows 的验证见 AGENTS.md；这里证明同样的代码在 Linux 上也走得通。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash # 带 -e 和 pipefail，管道里任何一步失败整步就失败
    env:
      EDA_AGENT_CONFIG: config.linux.yaml
      PYTHONUNBUFFERED: "1"
      # KiCadRoutingTools v0.23.7：安装脚本、缓存钥匙、检查步骤都用这两个值
      KRT_COMMIT: 83646c8b56c3571067c359cf5524167abfef4c0f
      KRT_SO_SHA256: 02e54aa45021ea6db60f9683dac165a8705164ce970b76c54becacbfd6d8d186
    # 提速（ADR-0012，用户 2026-10-31 选定）：KiCad 装得最久，检出后马上放到后台装；
    # 布线器缓存没命中时也在后台装；Python 依赖、lint、单元测试在前台同时进行，
    # 到工具测试之前才等后台装完。后台的输出在 ci-logs/bg/，等待的那一步会把它原样打印出来。
    steps:
      # 第三方 action 都钉在提交哈希上，旁边的注释是对应的版本号
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: KiCad 10 开始后台安装
        run: |
          mkdir -p ci-logs
          bash .github/scripts/bg.sh start kicad bash .github/scripts/install_kicad.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.14"

      # 缓存钥匙 = 机器镜像 + Python 的完整版本号 + 依赖清单的哈希，任何一个变了就重装一次。
      # 用 actions/cache 的默认做法：只有整次运行全部通过，才在最后保存缓存。
      - name: Python 依赖缓存
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: venv
          key: venv-ubuntu-24.04-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}

      - name: 布线器缓存
        id: krt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/KiCadRoutingTools
            .tools/venv-krt
          key: krt-ubuntu-24.04-py${{ steps.python.outputs.python-version }}-${{ env.KRT_COMMIT }}-${{ env.KRT_SO_SHA256 }}-${{ hashFiles('.github/krt-requirements.txt') }}

      - name: 布线器缓存没命中，KiCadRoutingTools 开始后台安装
        if: steps.krt-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/bg.sh start krt bash .github/scripts/install_krt.sh

      - name: fastroute 0.1.14 (校验哈希)
        run: |
          {
            mkdir -p .tools/fastroute .tools/downloads
            curl -fsSL -o .tools/downloads/fastroute.tar.gz \
              https://github.com/parisxmas/fastroute/releases/download/v0.1.14/fastroute-0.1.14-linux-x64.tar.gz
            echo "079a109f76d84836e7d7a54519e75759dcab9baacc9c58b4224b027b852e49c6  .tools/downloads/fastroute.tar.gz" | sha256sum -c -
            tar -xzf .tools/downloads/fastroute.tar.gz -C .tools/fastroute
            chmod +x .tools/fastroute/fastroute-0.1.14-linux-x64/fastroute
            # 不能写 `--help | head -3`：head 提前关管道时程序收到 SIGPIPE，pipefail 会把整步判失败
            .tools/fastroute/fastroute-0.1.14-linux-x64/fastroute --help > ci-logs/fastroute-help.txt
            head -3 ci-logs/fastroute-help.txt
          } 2>&1 | tee ci-logs/1-fastroute.log

      - name: Python 依赖 (缓存没命中才装)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          {
            python -m venv venv
            venv/bin/python -m pip install -r requirements-dev.txt
          } 2>&1 | tee ci-logs/2-python.log

      - name: lint
        run: venv/bin/python tasks.py lint 2>&1 | tee ci-logs/3-lint.log

      - name: 单元测试
        run: venv/bin/python tasks.py test 2>&1 | tee ci-logs/4-test.log

      - name: 等布线器装完
        if: steps.krt-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/bg.sh wait krt 600 2>&1 | tee ci-logs/5-krt.log

      - name: 检查布线器 (从缓存取出的也核对提交和哈希)
        run: |
          {
            head=$(git -C .tools/KiCadRoutingTools rev-parse HEAD)
            echo "KiCadRoutingTools 提交 $head"
            [ "$head" = "$KRT_COMMIT" ]
            echo "$KRT_SO_SHA256  .tools/KiCadRoutingTools/rust_router/grid_router.so" | sha256sum -c -
            .tools/venv-krt/bin/python .tools/KiCadRoutingTools/py_router/route.py --help > ci-logs/krt-help.txt
            head -3 ci-logs/krt-help.txt
          } 2>&1 | tee ci-logs/6-krt-check.log

      - name: 等 KiCad 装完
        # 下载最多重试 3 次、每次 5 分钟（install_kicad.sh），所以最多等 20 分钟
        run: bash .github/scripts/bg.sh wait kicad 1200 2>&1 | tee ci-logs/7-kicad.log

      - name: 工具测试 (需要 KiCad)
        run: xvfb-run -a venv/bin/python tasks.py test-tools 2>&1 | tee ci-logs/8-test-tools.log

      - name: 冒烟 (LED 电路走完整链路)
        run: xvfb-run -a venv/bin/python tasks.py smoke 2>&1 | tee ci-logs/9-smoke.log

      - name: 失败时把日志尾部写成注释 (Actions 日志要登录才能看，注释不用)
        if: failure()
        run: python3 .github/scripts/annotate_failure.py

      - name: 上传运行产物
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-run
          path: |
            ci-logs/
            runs/smoke-*/summary.json
            runs/smoke-*/trace.jsonl
            runs/smoke-*/gates/
            runs/smoke-*/logs/
            runs/smoke-*/final/renders/
            runs/smoke-*/kicad/*.kicad_sch
            .pytest_tmp/
          if-no-files-found: warn
          retention-days: 14
