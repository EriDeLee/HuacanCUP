# 复制成 config.yaml 再改（config.yaml 不进 git）。相对路径以仓库根目录为准。
# 这里是本机 Windows 的默认值（ADR-0001）。也可以用环境变量 EDA_AGENT_CONFIG 指定别的配置文件。
tools:
  # 外部工具的设置、缓存、临时文件都写到这里，不写到项目以外
  sandbox_home: .tools/home
  kicad_cli: .tools/kicad/bin/kicad-cli.exe
  # KiCad 自带的 Python 3.11，能 import pcbnew；不往里装任何包（ADR-0005、ADR-0007）
  kicad_python: .tools/kicad/bin/python.exe
  # KiCad 自带的符号库、封装库、3D 模型、示例工程所在目录
  kicad_share: .tools/kicad/share/kicad
  # KiCad 自带的 ngspice 共享库（ADR-0003）
  ngspice_lib: .tools/kicad/bin/ngspice.dll
  # 布线器：fastroute 主用，KiCadRoutingTools 备用（ADR-0004）
  fastroute: .tools/fastroute/fastroute-0.1.14-windows-x64/fastroute.exe
  krt_python: .tools/venv-krt/Scripts/python.exe
  krt_route: .tools/KiCadRoutingTools/py_router/route.py
  timeouts:
    default_s: 300
    route_s: 900
    sim_s: 120

gates:
  # G1 额定值检查：网络电压、器件电流、功耗 ≤ 器件额定值 × 降额系数（PLAN §7）
  derating: 0.8

pcb:
  # G3 线宽检查和版图智能体定线宽（IPC-2221）：铜厚 1 oz/ft² = 35 µm，温升 10 °C
  copper_thickness_um: 35
  temp_rise_c: 10

placement:
  # 自动摆放（ADR-0018）。mode: auto = 模拟退火；rows = 原来的按行排（用来对比）
  mode: auto
  seed: 1 # 同样的输入和种子得到同样的摆放，种子写进 trace
  restarts: 1 # >1 时用 seed、seed+1…各摆一次，取分数最好的
  iterations_per_part: 1500
  min_gap_mm: 1.0 # 元件 courtyard 之间的最小间隙
  edge_margin_mm: 1.0 # courtyard 离板边的最小距离；板边连接器贴在这条线上
  edge_preferred_mm: 2.5 # 非连接器元件离板边最好不要比这更近（分数里的一项）
  weights: # 分数各项的权重，都换算成 mm 量级，hpwl 是 1
    hpwl: 1.0 # 总线长
    block: 0.5 # 同一功能块的元件聚在一起
    flow: 0.3 # 信号按流向从左往右排
    edge: 1.0 # 离板边太近
    overlap: 40.0 # courtyard 重叠、出区域（每 mm）
